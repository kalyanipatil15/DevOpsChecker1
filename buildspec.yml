version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.8
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Pre-build phase started"

  build:
    commands:
      - echo "Build phase started"
      - python -m py_compile app.py

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - '**/*'
